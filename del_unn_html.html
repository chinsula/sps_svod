<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Обработка файлов без транслитерации</title>
</head>
<body>
<h2>Обработка файлов без транслитерации</h2>

<input type="file" id="file1" accept=".xlsx, .xls" />
<label for="file1">Выберите первый файл</label><br/><br/>

<input type="file" id="file2" accept=".xlsx, .xls" />
<label for="file2">Выберите второй файл</label><br/><br/>

<button id="processBtn" disabled>Запустить обработку</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
const fileInput1 = document.getElementById('file1');
const fileInput2 = document.getElementById('file2');
const processBtn = document.getElementById('processBtn');

let file1Content = null;
let file2Content = null;

fileInput1.addEventListener('change', () => {
    if (fileInput1.files.length > 0) {
        readExcelFile(fileInput1.files[0], (data) => {
            file1Content = data;
            checkReady();
        });
    }
});

fileInput2.addEventListener('change', () => {
    if (fileInput2.files.length > 0) {
        readExcelFile(fileInput2.files[0], (data) => {
            file2Content = data;
            checkReady();
        });
    }
});

function checkReady() {
    if (file1Content && file2Content) {
        processBtn.disabled = false;
    }
}

processBtn.addEventListener('click', () => {
    if (file1Content && file2Content) {
        processFiles();
    }
});

function readExcelFile(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, {header:1});
        callback(json);
    };
    reader.readAsArrayBuffer(file);
}

function processFiles() {
    const df_first = file1Content;
    const df_second = file2Content;

    // Создаем множество из второго файла
    const set_of_strings = new Set();
    for (let row of df_second) {
        if (row.length > 0 && row[0] != null) {
            let s = String(row[0]);
            if (s.length > 2) {
                s = s.slice(0, -2);
            }
            s = s.replace(/\s+/g, '').toUpperCase();
            set_of_strings.add(s);
        }
    }

    // Фильтруем строки первого файла
    const результаты = [];
    for (let row of df_first) {
        for (let colIdx of [0, 2]) {
            if (row[colIdx] != null) {
                let cell = String(row[colIdx]);
                let cell_cleaned = cell.replace(/\s+/g, '').toUpperCase();
                for (let elem of set_of_strings) {
                    if (cell_cleaned.includes(elem)) {
                        результаты.push(row);
                        break;
                    }
                }
                if (результаты.includes(row)) break;
            }
        }
    }

    // Удаляем дубликаты
    const uniqueResults = Array.from(new Set(результаты.map(r => JSON.stringify(r)))).map(s => JSON.parse(s));

    // Создаем новую книгу и файл
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(uniqueResults);
    XLSX.utils.book_append_sheet(wb, ws, "Результат");

    // Генерируем файл для скачивания
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type: 'application/octet-stream'});

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const filename = `Результат_${new Date().toISOString().replace(/[:.]/g, '-')}.xlsx`;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
